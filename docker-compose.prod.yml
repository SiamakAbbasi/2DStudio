services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: studio
      POSTGRES_USER: studio
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - studio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studio -d studio"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 5175
      DATABASE_URL: postgresql://studio:${POSTGRES_PASSWORD}@db:5432/studio
      SESSION_SECRET: ${SESSION_SECRET}
      APP_ORIGIN: http://${VPS_HOST}:${APP_PORT}
      LOCAL_PASSWORD_RESET: "false"
    ports:
      - "${APP_PORT}:5175"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:5175/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

volumes:
  studio_postgres:
